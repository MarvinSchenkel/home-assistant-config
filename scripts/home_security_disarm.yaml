---
alias: home_security_disarm
description: Disarm home security and clear pending state
mode: single
fields:
  manual:
    description: Suppress automatic rearming for the current cycle
  clear_incident:
    description: Classify and clear the active incident
sequence:
  - variables:
      current_mode: "{{ states('input_select.home_security_armed_mode') }}"
      manual_request: "{{ manual | default(false) }}"
  - if:
      - condition: template
        value_template: "{{ manual_request and current_mode == 'armed_away' }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.home_security_away_manual_suppressed
  - if:
      - condition: template
        value_template: "{{ manual_request and current_mode == 'armed_home' }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.home_security_night_manual_suppressed
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.home_security_automatic_arm
  - action: input_boolean.turn_off
    target:
      entity_id:
        - input_boolean.home_security_away_arm_pending
        - input_boolean.home_security_away_arm_block_notified
        - input_boolean.home_security_night_arm_pending
        - input_boolean.home_security_night_arm_block_notified
  - action: timer.cancel
    target:
      entity_id: timer.home_security_entry_delay
  - action: input_text.set_value
    target:
      entity_id: input_text.home_security_pending_entry_source
    data:
      value: ""
  - if:
      - condition: template
        value_template: "{{ clear_incident | default(false) }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.home_security_incident_active
  - action: input_select.select_option
    target:
      entity_id: input_select.home_security_armed_mode
    data:
      option: disarmed
