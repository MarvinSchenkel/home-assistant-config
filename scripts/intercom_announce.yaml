---
alias: intercom_announce
description: >
  Speak a message on the Music Assistant group. Queued, so an overlapping
  notification never clears input_boolean.intercom_announcing while another
  one is still playing.
mode: queued
max: 10

fields:
  message:
    description: The text to speak

sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.intercom_announcing
  # Blocks until MA has played the announcement and restored the speakers
  - action: tts.speak
    continue_on_error: true
    target:
      entity_id: tts.home_assistant_cloud
    data:
      cache: true
      language: nl-NL
      message: "{{ message }}"
      media_player_entity_id: '{{ states("sensor.mass_media_entity") }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.intercom_announcing
