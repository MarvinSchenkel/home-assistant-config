---
alias: intercom_announce
description: >
  Speak a message on the Music Assistant group. Queued, so overlapping
  notifications play one after another. The speaker volume automations
  stay out of the way while this script is on, which covers the whole queue.
mode: queued
max: 10

fields:
  message:
    description: The text to speak

sequence:
  # Blocks until MA has played the announcement and restored the speakers
  - action: tts.speak
    continue_on_error: true
    target:
      entity_id: tts.marvin_voice
    data:
      cache: true
      message: "{{ message }}"
      media_player_entity_id: '{{ states("sensor.mass_media_entity") }}'
