---
# A binary indicator tracking whether it is light or dark in the room
triggers:
  - trigger: numeric_state
    entity_id:
      - sensor.pir_bathroom_door_luminance
    above: 15
    for:
      seconds: 5
  - trigger: numeric_state
    entity_id:
      - sensor.pir_bathroom_door_luminance
    above: 90
    for:
      seconds: 5
  - trigger: numeric_state
    entity_id:
      - sensor.pir_bathroom_door_luminance
    below: 15
    for:
      seconds: 5
  - trigger: state
    entity_id: sensor.pir_bathroom_door_luminance
    to:
      - unavailable
      - unknown
  - trigger: event
    event_type: event_template_reloaded
  # A restart restores the old state, which only a trigger re-evaluates
  - trigger: homeassistant
    event: start

binary_sensor:
  - name: bathroom_is_dark
    unique_id: 1cf2b12e-9202-410e-bcc9-9ff2cf812f5a
    # No availability: a missing lux reading counts as dark, so motion lights keep working
    state: >
      {%-
        if (
          states("sensor.pir_bathroom_door_luminance") | int(0) > 15
          and is_state("light.bathroom", "off")
        )
        or states("sensor.pir_bathroom_door_luminance") | int(0) > 90
      -%}
        off
      {%- else -%}
        on
      {%- endif -%}
