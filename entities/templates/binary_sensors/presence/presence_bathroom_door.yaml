---
# A binary sensor that is triggered when opening the door
# It triggers presence for 10sec, so that presence is not constantly
# detected when someone does not close the door
trigger:
  - platform: state
    entity_id: binary_sensor.bathroom_door_open
    to: "on"

binary_sensor:
  - name: presence_bathroom_door
    unique_id: abb3fdda-dd31-49cc-ba35-a616260348ab
    auto_off: 10
    state: "on"
