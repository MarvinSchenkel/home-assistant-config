---
binary_sensor:
  - name: marvin_is_working
    unique_id: ed8ecc89-81c9-455d-9394-88e926f5fee2
    # The companion app's Active sensor already covers locked, asleep, screensaver and idle.
    state: >
      {{ is_state("binary_sensor.mac_studio_active", "on") and now().hour >= 7 }}
    # Idle flips true after a few minutes away from the desk, so ride out short breaks.
    delay_off: "00:15:00"