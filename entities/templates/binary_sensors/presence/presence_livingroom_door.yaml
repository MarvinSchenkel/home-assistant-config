---
# A binary sensor that is triggered when opening the door
# It triggers presence for 10sec, so that presence is not constantly
# detected when someone does not close the door
trigger:
  - trigger: state
    entity_id: binary_sensor.livingroom_door_open
    to: "on"

binary_sensor:
  - name: presence_livingroom_door
    unique_id: 6d410db5-079b-4254-930d-32d5e2748ba7
    auto_off: 10
    state: "on"
