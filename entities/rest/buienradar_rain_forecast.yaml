---
# 2-hour rain nowcast in 5-minute slots, the data behind the Buienradar
# rain graph. The Buienradar integration only exposes aggregates of this.
# Coordinates come from secrets: a template on zone.home renders during rest
# setup, before the zone exists, and fails the whole rest integration.
resource: https://graphdata.buienradar.nl/2.0/forecast/geo/Rain3Hour
params:
  lat: !secret home_lat
  lon: !secret home_lon
scan_interval: 300
sensor:
  - name: Buienradar rain forecast
    unique_id: buienradar_rain_forecast
    unit_of_measurement: mm
    value_template: >-
      {{ ((value_json.forecasts | map(attribute='precipitation') | sum) * 5 / 60)
         | round(1) }}
    json_attributes:
      - forecasts
