---
# The recorder component is storing details in a database which
# then are handled by the history component.
#
# https://www.home-assistant.io/integrations/recorder/
#
recorder:
  # The number of days of history to keep in the recorder database
  purge_keep_days: 3

  exclude:
    entities:
      # Forecast slots are a ~3.5 KB attribute refreshed every 5 minutes
      - sensor.buienradar_rain_forecast
      # Fast-changing readings without a history consumer
      - sensor.solaredge_i1_ac_frequency
      - sensor.solaredge_i1_ac_current
      - sensor.solaredge_i1_dc_current
      - sensor.solaredge_i1_dc_voltage
      - sensor.solaredge_i1_temp_sink
      - sensor.gw3000a_wind_direction
      - sensor.gw3000a_wind_speed
      - sensor.gw3000a_solar_lux
      - sensor.gw3000a_solar_radiation
      - sensor.apple_watch_marvin_distance
      - sensor.rk3326_free_memory
      - sensor.statistical_characteristic
    entity_globs:
      - sensor.solaredge_i1_ac_voltage_*
