---
description: >
  Warm up the espresso machine 10 minutes after the first person comes
  downstairs in the morning
alias: areas_kitchen_coffee_machine
mode: single
id: d6d17c78-edc4-4eae-944f-e4dd4df60d2a

trigger:
  # Net wakker is the living room's first presence after the night; it lasts 40 minutes
  - trigger: state
    entity_id: input_select.livingroom_room_mode
    to: "Net wakker"
    for:
      minutes: 10

condition:
  - condition: time
    after: "05:00:00"
    before: "11:00:00"
  - condition: state
    entity_id: binary_sensor.everyone_left_home
    state: "off"
  - condition: state
    entity_id: switch.decent_espresso_de1pro_de1_on
    state: "off"

action:
  - action: switch.turn_on
    target:
      entity_id: switch.decent_espresso_de1pro_de1_on
