---
alias: areas_livingroom_lights_manual_control
description: >-
  Marks the livingroom and kitchen lights as manually controlled when one of
  the tap dial switches is used, so the lights automations leave them alone.
  Resets when both rooms have been empty for a while or at the start of a new
  day.
mode: queued
id: 2ca5abab-72d9-4770-9b29-f60f4e02aaa5
trace:
  stored_traces: 25

trigger:
  - trigger: state
    entity_id:
      - event.hue_tap_dial_switch_17_button_1
      - event.hue_tap_dial_switch_17_button_2
      - event.hue_tap_dial_switch_17_button_3
      - event.hue_tap_dial_switch_17_button_4
      - event.hue_tap_dial_switch_17_rotary
      - event.hue_tap_dial_switch_19_button_1
      - event.hue_tap_dial_switch_19_button_2
      - event.hue_tap_dial_switch_19_button_3
      - event.hue_tap_dial_switch_19_button_4
      - event.hue_tap_dial_switch_19_rotary
    not_from:
      - unavailable
      - unknown
    id: dial_used

  - trigger: state
    entity_id:
      - binary_sensor.presence_livingroom
      - binary_sensor.presence_kitchen
    to: "off"
    for:
      minutes: 10
    id: rooms_empty

  - trigger: time
    at: "00:02:00"
    id: reset

condition:
  - condition: state
    entity_id: input_boolean.setting_manual_lights
    state: "off"

action:
  - choose:
      - alias: "Mark the lights as manually controlled when a dial is used"
        conditions:
          - condition: trigger
            id: dial_used
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.livingroom_manual_control

      - alias: "Reset manual control when both rooms have been empty for a while"
        conditions:
          - condition: trigger
            id: rooms_empty
          - condition: state
            entity_id: binary_sensor.presence_livingroom
            state: "off"
            for:
              minutes: 10
          - condition: state
            entity_id: binary_sensor.presence_kitchen
            state: "off"
            for:
              minutes: 10
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.livingroom_manual_control

      - alias: "Reset manual control at the start of a new day"
        conditions:
          - condition: trigger
            id: reset
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.livingroom_manual_control
