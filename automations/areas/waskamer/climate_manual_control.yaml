---
alias: areas_waskamer_climate_manual_control
description: >-
  Marks the waskamer airco as manually controlled when it is changed outside
  the climate automation, so that automation leaves it alone. Resets when the
  expiry timer finishes.
mode: queued
id: 2c378c22-6053-4699-b9af-e58b0b1e4055
trace:
  stored_traces: 25

trigger:
  - trigger: state
    entity_id: climate.ac_waskamer
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: ac_changed

  - trigger: state
    entity_id: climate.ac_waskamer
    attribute: temperature
    id: ac_changed

  - trigger: state
    entity_id: climate.ac_waskamer
    attribute: fan_mode
    id: ac_changed

  - trigger: state
    entity_id: input_boolean.waskamer_climate_manual_control
    to: "on"
    id: manual_on

  - trigger: state
    entity_id: input_boolean.waskamer_climate_manual_control
    to: "off"
    id: manual_off

  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.waskamer_climate_manual_control
    id: manual_expired

action:
  - choose:
      - alias: "Mark manual control when the airco is changed outside the climate automation"
        conditions:
          - condition: trigger
            id: ac_changed
          - condition: template
            value_template: >-
              {{ trigger.from_state.state not in ['unavailable', 'unknown']
                 and trigger.to_state.state not in ['unavailable', 'unknown']
                 and trigger.to_state.context.id
                     != states('input_text.waskamer_climate_write_ctx') }}
        sequence:
          - action: script.manual_control_activate
            data:
              helper: waskamer_climate_manual_control

      - alias: "Start the expiry timer when manual control turns on"
        conditions:
          - condition: trigger
            id: manual_on
        sequence:
          - action: script.manual_control_activate
            data:
              helper: waskamer_climate_manual_control

      - alias: "Cancel the expiry timer when manual control turns off"
        conditions:
          - condition: trigger
            id: manual_off
        sequence:
          - action: script.manual_control_deactivate
            data:
              helper: waskamer_climate_manual_control

      - alias: "Release manual control when the expiry timer finishes"
        conditions:
          - condition: trigger
            id: manual_expired
        sequence:
          - action: script.manual_control_deactivate
            data:
              helper: waskamer_climate_manual_control
