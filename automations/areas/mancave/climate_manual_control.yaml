---
alias: areas_mancave_climate_manual_control
description: >-
  Marks the mancave airco as manually controlled when it is changed outside
  the climate automation, so that automation leaves it alone. Resets when the
  expiry timer finishes or when the room has been empty for a while.
mode: queued
id: 46a917b4-3cf4-46a9-a214-bee66e8b4d5a
trace:
  stored_traces: 25

trigger:
  - trigger: state
    entity_id: climate.ac_mancave
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: ac_changed

  - trigger: state
    entity_id: climate.ac_mancave
    attribute: temperature
    id: ac_changed

  - trigger: state
    entity_id: climate.ac_mancave
    attribute: fan_mode
    id: ac_changed

  - trigger: state
    entity_id: input_boolean.mancave_climate_manual_control
    to: "on"
    id: manual_on

  - trigger: state
    entity_id: input_boolean.mancave_climate_manual_control
    to: "off"
    id: manual_off

  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.mancave_climate_manual_control
    id: manual_expired

  - trigger: state
    entity_id: binary_sensor.presence_mancave
    to: "off"
    for:
      minutes: 10
    id: room_vacated

action:
  - choose:
      - alias: "Mark manual control when the airco is changed outside the climate automation"
        conditions:
          - condition: trigger
            id: ac_changed
          # Before the airco echoes our command back, a differing report is cloud lag
          - condition: template
            value_template: >-
              {% set intent = states('input_text.mancave_climate_write_ctx').split('|') %}
              {% set reported = trigger.to_state %}
              {% set differs = intent | count != 4
                   or reported.state != intent[0]
                   or reported.attributes.temperature | float(-1) != intent[1] | float(-2)
                   or reported.attributes.fan_mode != intent[2] %}
              {{ trigger.from_state.state not in ['unavailable', 'unknown']
                 and reported.state not in ['unavailable', 'unknown']
                 and differs
                 and ((intent | count == 4 and intent[3] == 'ok')
                      or reported.context.user_id is not none) }}
        sequence:
          - action: script.manual_control_activate
            data:
              helper: mancave_climate_manual_control

      - alias: "Start the expiry timer when manual control turns on"
        conditions:
          - condition: trigger
            id: manual_on
        sequence:
          - action: script.manual_control_activate
            data:
              helper: mancave_climate_manual_control

      - alias: "Cancel the expiry timer when manual control turns off"
        conditions:
          - condition: trigger
            id: manual_off
        sequence:
          - action: script.manual_control_deactivate
            data:
              helper: mancave_climate_manual_control

      - alias: "Release manual control when the expiry timer finishes"
        conditions:
          - condition: trigger
            id: manual_expired
        sequence:
          - action: script.manual_control_deactivate
            data:
              helper: mancave_climate_manual_control

      - alias: "Release manual control when the room has been empty for a while"
        conditions:
          - condition: trigger
            id: room_vacated
        sequence:
          - action: script.manual_control_deactivate
            data:
              helper: mancave_climate_manual_control
