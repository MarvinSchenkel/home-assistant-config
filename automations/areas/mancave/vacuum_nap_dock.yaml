---
description: >
  Send Minty back to its dock when the master bedroom goes to Dutje, so it
  does not wake Saar during her nap.
alias: areas_mancave_vacuum_nap_dock
mode: single
id: 28ce3c90-0f16-4579-b5c8-1693f5d385d6

trigger:
  - trigger: state
    entity_id: input_select.master_bedroom_room_mode
    to: "Dutje"

condition:
  - condition: state
    entity_id: vacuum.minty
    state:
      - "cleaning"
      - "paused"
      - "idle"
      - "returning"

action:
  - action: vacuum.return_to_base
    target:
      entity_id: vacuum.minty
