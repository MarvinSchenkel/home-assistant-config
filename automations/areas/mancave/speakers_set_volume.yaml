---
description: >
  Set the volume of the Mancave WiiM Amp based on the music schedule. The amp is
  the static leader of the house group and can therefore never be unjoined, so
  it is muted instead whenever the Mancave should be silent.
alias: areas_mancave_speakers_set_volume
id: 891d1b19-0620-48ad-a442-b8816d9483b2
mode: queued
max_exceeded: silent

variables:
  just_awake_volume: 8
  early_morning_volume: 10
  morning_volume: 11
  day_volume: 13
  evening_volume: 8
  mass_entity: media_player.mass_mancave_wiim_amp
  music_schedule: "{{ states('input_select.current_music_schedule') }}"

triggers:
  - trigger: state
    entity_id:
      - input_select.current_music_schedule
      - input_boolean.setting_automatic_music

  - trigger: state
    entity_id: media_player.mass_mancave_wiim_amp
    to: "playing"

  - trigger: state
    entity_id:
      - input_select.mancave_room_mode
      - binary_sensor.mac_studio_camera_in_use

  - trigger: state
    entity_id: media_player.mancave_tv
    attribute: source

  - trigger: state
    entity_id: binary_sensor.presence_mancave
    to: "on"

  - trigger: state
    entity_id: binary_sensor.presence_mancave
    to: "off"
    for:
      seconds: 300

conditions:
  - alias: "Only control the volume when we are automating the music"
    condition: state
    entity_id: input_boolean.setting_automatic_music
    state: "on"

actions:
  - variables:
      schedule_volume: >
        {% if music_schedule == "just_awake" %}
          {{ just_awake_volume }}
        {% elif music_schedule == "early_morning" %}
          {{ early_morning_volume }}
        {% elif music_schedule == "morning" %}
          {{ morning_volume }}
        {% elif music_schedule == "day" %}
          {{ day_volume }}
        {% elif music_schedule == "evening" %}
          {{ evening_volume }}
        {% else %}
          0
        {% endif %}

  - choose:
      - alias: "Silence the amp while the Mancave is unused"
        conditions:
          - or:
              - alias: "Nobody in the Mancave"
                condition: state
                entity_id: binary_sensor.presence_mancave
                state: "off"
                for:
                  seconds: 300
              - alias: "The Mancave is asleep"
                condition: state
                entity_id: input_select.mancave_room_mode
                state: "Slaap"
              - alias: "I am in a call"
                condition: state
                entity_id: binary_sensor.mac_studio_camera_in_use
                state: "on"
              - alias: "We're playing a game"
                condition: state
                entity_id: media_player.mancave_tv
                attribute: "source"
                state:
                  - "PS5 Game Console"
                  - "Nintendo Switch Game Console"
        sequence:
          - if: '{{ "is_volume_muted" in states[mass_entity].attributes }}'
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: "{{ mass_entity }}"
                data:
                  is_volume_muted: true
            else:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ mass_entity }}"
                data:
                  volume_level: 0

      - conditions: "{{ schedule_volume | int > 0 }}"
        sequence:
          - if: '{{ "is_volume_muted" in states[mass_entity].attributes }}'
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: "{{ mass_entity }}"
                data:
                  is_volume_muted: false

          - action: media_player.volume_set
            target:
              entity_id: "{{ mass_entity }}"
            data:
              volume_level: "{{ schedule_volume | int / 100.0 }}"
