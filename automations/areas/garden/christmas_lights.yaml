---
alias: areas_garden_christmas_lights
description: Turns the outdoor christmas lights on/off
mode: single
id: 510911b6-20d3-40be-a3a7-75fdf41dca82

trigger:
  # Fires once a year, the first day after the christmas season
  - trigger: template
    value_template: "{{ now().month == 1 and now().day == 8 }}"
    id: season_end

  - trigger: numeric_state
    entity_id:
      - sensor.sun_elevation
    below: 0

  - trigger: numeric_state
    entity_id:
      - sensor.sun_elevation
    above: 0

  - trigger: state
    entity_id: input_select.livingroom_room_mode

  - trigger: homeassistant
    event: start

  - trigger: event
    event_type: automation_reloaded

condition:
  - or:
      - alias: "Christmas season (1 December to 7 January)"
        condition: template
        value_template: "{{ now().month == 12 or (now().month == 1 and now().day <= 7) }}"
      - condition: trigger
        id: season_end

action:
  - choose:
      - alias: "Turn the christmas lights off when the season is over."
        conditions:
          - condition: trigger
            id: season_end
        sequence:
          - action: switch.turn_off
            data:
              entity_id: switch.christmas_lights_shed

      - conditions:
          - condition: numeric_state
            entity_id:
              - sensor.sun_elevation
            below: 0
          - not:
              - condition: state
                entity_id:
                  - input_select.livingroom_room_mode
                state: "Slaap"
        sequence:
          - action: switch.turn_on
            data:
              entity_id: switch.christmas_lights_shed

    default:
      - action: switch.turn_off
        data:
          entity_id: switch.christmas_lights_shed
