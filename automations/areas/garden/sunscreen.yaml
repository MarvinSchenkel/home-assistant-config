---
alias: areas_garden_sunscreen
description: >
  Control the sunscreen based on:
    - The sun angle / whether it's hot
    - Heavy wind / rain detected (retracts the screen)
    - Only redeploy for sun once the wind has been calm for 10 min, so a
      gust does not bounce the screen down and straight back up
    - The manual control switch (weather retract always wins over it)
mode: queued
max_exceeded: silent
id: 028db081-471a-4fee-8373-844eca4943a9

trigger:
  - trigger: homeassistant
    event: start
    id: resync

  - trigger: event
    event_type: automation_reloaded
    id: resync

  - trigger: state
    entity_id:
      - binary_sensor.sun_should_close_south_blinds
    from: ~

  - trigger: state
    entity_id:
      - binary_sensor.weather_can_close_sunscreen
    to: "off"

  - trigger: numeric_state
    entity_id:
      - sensor.sun_azimuth
    above: 285
    id: "sun_gone"

  # Re-evaluate once the wind has been calm for 10 min, so the screen can
  # redeploy for the sun after a gust without us polling for it.
  - trigger: state
    entity_id:
      - binary_sensor.weather_can_close_sunscreen
    to: "on"
    for:
      minutes: 10

  - trigger: time
    at: "03:00:00"
    id: "reset"

variables:
  anchors:
    - &sunscreen_up
      alias: "Open the sunscreen"
      action: scene.turn_on
      target:
        entity_id:
          - scene.garden_cover_open

    - &sunscreen_down
      alias: "Close the sunscreen"
      action: scene.turn_on
      target:
        entity_id:
          - scene.garden_cover_sunblock

action:
  - choose:
      # Safety first: weather retract outranks the manual override below
      - alias: "Close sunscreen when sun is gone or wind / rain is detected"
        conditions:
          - or:
              - condition: trigger
                id: "sun_gone"
              - condition: state
                entity_id:
                  - binary_sensor.weather_can_close_sunscreen
                state: "off"
        sequence: *sunscreen_up

      - alias: "Reset manual override before the new day starts"
        conditions:
          - condition: trigger
            id: "reset"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sunscreen_manual_control

      - alias: "Stop automating the screen when manual control is on"
        conditions:
          - condition: state
            entity_id:
              - input_boolean.sunscreen_manual_control
            state: "on"
        sequence:
          - stop: "Sunscreen is manually controlled"

      - alias: "Keep the dinner state active"
        conditions:
          - condition: state
            entity_id:
              - input_select.garden_current_cover_scene
            state: "dinner"
        sequence: []

      - alias: "Close the screen when it is hot and the wind has been calm 10 min"
        conditions:
          - condition: state
            entity_id:
              - binary_sensor.sun_should_close_south_blinds
            state: "on"
          - or:
              - condition: state
                entity_id:
                  - binary_sensor.weather_can_close_sunscreen
                state: "on"
                for:
                  minutes: 10
              # A restart re-stamps the calm timer, so a resync trusts the current state
              - and:
                  - condition: trigger
                    id: resync
                  - condition: state
                    entity_id:
                      - binary_sensor.weather_can_close_sunscreen
                    state: "on"
        sequence:
          - *sunscreen_down

    default:
      - *sunscreen_up

  # Prevent race condition
  - delay:
      seconds: 10
