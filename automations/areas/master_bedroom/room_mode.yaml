---
alias: areas_master_bedroom_room_mode
description: Determine the room mode
mode: queued
id: e153a617-7601-494d-8f23-13e6df694439

trigger:
  - trigger: event
    id: "button_laura_one"
    event_type: "zha_event"
    event_data:
      device_ieee: "00:15:8d:00:06:36:dc:60"
      command: "single"

  - trigger: event
    event_type: "zha_event"
    event_data:
      device_ieee: "00:15:8d:00:06:36:dc:60"
      command: "hold"
    id: "button_laura_hold"

  - trigger: state
    id: "net_wakker_40m"
    entity_id:
      - input_select.master_bedroom_room_mode
    to: "Net wakker"
    for:
      minutes: 40

  - trigger: state
    entity_id:
      - event.hue_switch_on
      - event.hue_switch_off
    id: hue_remote

  - trigger: time
    id: "bedtime"
    at:
      - "22:00:00"
      - "23:30:00"

variables:
  anchors:
    - &select_mode
      action: input_select.select_option
      entity_id: input_select.master_bedroom_room_mode

action:
  - choose:
      - conditions:
          - or:
              # In Dutje a single press only toggles Laura's lamp (lights automation)
              - and:
                  - condition: trigger
                    id: "button_laura_one"
                  - not:
                      - condition: state
                        entity_id: input_select.master_bedroom_room_mode
                        state: "Dutje"
              - and:
                  - condition: trigger
                    id: "hue_remote"
                  - condition: state
                    match: any
                    entity_id:
                      - event.hue_switch_on
                      - event.hue_switch_off
                    attribute: "event_type"
                    state: "repeat"
        sequence:
          - <<: *select_mode
            data:
              option: "Slaap"

      - conditions:
          - condition: trigger
            id: "button_laura_hold"
        sequence:
          - <<: *select_mode
            data:
              option: "Net wakker"

      - conditions:
          - condition: trigger
            id: "net_wakker_40m"
        sequence:
          - <<: *select_mode
            data:
              option: "Wakker"

      - conditions:
          - condition: trigger
            id: "bedtime"
          - condition: state
            entity_id: input_select.master_bedroom_room_mode
            state: "Dutje"
          - condition: state
            entity_id: binary_sensor.someone_in_bed
            state: "on"
        sequence:
          - <<: *select_mode
            data:
              option: "Slaap"

    default: []
