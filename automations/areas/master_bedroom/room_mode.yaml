---
alias: areas_master_bedroom_room_mode
description: Determine the room mode
mode: queued
id: e153a617-7601-494d-8f23-13e6df694439

trigger:
  - trigger: event
    id: "button_laura_one"
    event_type: "zha_event"
    event_data:
      device_id: "5256a27d772442b3a6065b595fc4a327"
      command: "single"

  - trigger: event
    event_type: "zha_event"
    event_data:
      device_id: "5256a27d772442b3a6065b595fc4a327"
      command: "hold"
    id: "button_laura_hold"

  - trigger: state
    id: "net_wakker_40m"
    entity_id:
      - input_select.master_bedroom_room_mode
    to: "Net wakker"
    for:
      minutes: 40

  - trigger: state
    entity_id:
      - event.hue_switch_on
      - event.hue_switch_off
    id: hue_remote

variables:
  anchors:
    - &select_mode
      action: input_select.select_option
      entity_id: input_select.master_bedroom_room_mode

action:
  - choose:
      - conditions:
          - or:
              - condition: trigger
                id: "button_laura_one"
              - and:
                  - condition: trigger
                    id: "hue_remote"
                  - condition: state
                    match: any
                    entity_id:
                      - event.hue_switch_on
                      - event.hue_switch_off
                    attribute: "event_type"
                    state: "repeat"
        sequence:
          - <<: *select_mode
            data:
              option: "Slaap"

      - conditions:
          - condition: trigger
            id: "button_laura_hold"
        sequence:
          - <<: *select_mode
            data:
              option: "Net wakker"

      - conditions:
          - condition: trigger
            id: "net_wakker_40m"
        sequence:
          - <<: *select_mode
            data:
              option: "Wakker"

    default: []
