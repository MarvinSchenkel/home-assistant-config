---
alias: areas_master_bedroom_climate
description: >
  Manages the Daikin airco in our master bedroom: room mode, presence, solar
  export and forecast all feed into one idempotent decision cascade.
  Cooling only — we never heat the bedroom
id: 0a71bc6d-3ba2-45b3-af71-5b8489f1665e
mode: queued
max_exceeded: silent
trace:
  stored_traces: 25

trigger:
  - trigger: homeassistant
    event: start

  - trigger: event
    event_type: automation_reloaded

  - trigger: state
    entity_id:
      - input_select.master_bedroom_room_mode
      - binary_sensor.everyone_left_home
      - binary_sensor.marvin_likely_home_tonight
      - binary_sensor.laura_likely_home_tonight
    from: ~

  - trigger: state
    entity_id: input_number.master_bedroom_sleep_hold_temperature
    from: ~

  # Trigger platforms can't reference the variables block below, so entity
  # ids and the export thresholds (export_start_kw / export_stop_kw) are
  # repeated here literally
  - trigger: numeric_state
    entity_id: sensor.power_production
    above: 1.0
    for:
      minutes: 15

  - trigger: numeric_state
    entity_id: sensor.power_production
    below: 0.2
    for:
      minutes: 15

  - trigger: state
    entity_id:
      - binary_sensor.is_hot_day
      - binary_sensor.is_hot_day_predicted
    from: ~

  - trigger: time
    at: input_datetime.master_bedroom_approx_target_sleep_time

  # Cheap re-evaluation heartbeat — the differing-state guards below make
  # this free w.r.t. the airco's cloud API budget. Also what picks up the
  # pre-bed window before the scheduled sleep time
  - trigger: time_pattern
    minutes: "/15"

  - trigger: state
    entity_id: input_boolean.masterbedroom_climate_manual_control
    to: "off"

variables:
  room_temp_entity: sensor.pir_master_bedroom_temperature
  outdoor_temp_entity: sensor.current_temperature
  airco_entity: climate.airco_master_bedroom
  room_mode_entity: input_select.master_bedroom_room_mode
  sleep_time_entity: input_datetime.master_bedroom_approx_target_sleep_time
  # DSMR P1 net flow — own solar consumption is already subtracted
  export_power_entity: sensor.power_production
  import_power_entity: sensor.power_consumption

  # Earlier pre-cooling wastes coolth to the morning flush
  precool_not_before: "11:00"

  # --- temperatures (°C) ---
  target_room_temperature: 22.5  # awake comfort / pre-cool target
  target_sleep_temperature: 22.0  # bedtime top-up target
  # Tropical-night quiet hold; 23.5 + moving air sleeps like 21 still air
  sleep_hold_temperature: >-
    {{ states('input_number.master_bedroom_sleep_hold_temperature') | float(23.5) }}
  tropical_night_threshold: 20.0  # outdoor stays above this -> coasting alone fails
  # Adaptive comfort: awake target never more than this below outdoor
  max_diff_with_outdoor: 7.0
  temp_hysteresis: 0.5

  # --- solar export thresholds (kW on the P1 meter) ---
  export_start_kw: 1.0
  export_stop_kw: 0.2
  # Credited back while cooling, capped at real import so an idle unit can't fake it
  airco_draw_kw: 0.6
  # The occupied office outranks this room's deadline-free pre-cool
  office_reserve_kw: 0.6

  # --- computed each run ---
  room_temp: "{{ states(room_temp_entity) | float(0) }}"
  outdoor_temp: "{{ states(outdoor_temp_entity) | float(0) }}"
  awake_target: "{{ [target_room_temperature, outdoor_temp - max_diff_with_outdoor] | max }}"
  # heat excluded on purpose: a manual heat choice is never ours to stop
  airco_compressor_active: "{{ states(airco_entity) in ['cool', 'dry'] }}"
  available_surplus: >-
    {% set import_kw = states(import_power_entity) | float(0) %}
    {% set own_draw = [airco_draw_kw, import_kw] | min %}
    {{ states(export_power_entity) | float(0) - import_kw
       + (own_draw if is_state(airco_entity, 'cool') else 0) }}
  # During Slaap/Dutje this cascade stops before pre-cool — office gets everything.
  # 10-min last_changed window = the office's own work-break debounce, keep in sync
  mancave_needs_comfort: >-
    {{ is_state('climate.ac_mancave', 'off')
       and states('sensor.pir_mancave_temperature') | float(0) >= 24.5
       and (is_state('binary_sensor.marvin_is_working', 'on')
            or now() - states.binary_sensor.marvin_is_working.last_changed
               < timedelta(minutes=10)) }}
  anyone_likely_home_tonight: >-
    {{ is_state('binary_sensor.marvin_likely_home_tonight', 'on')
       or is_state('binary_sensor.laura_likely_home_tonight', 'on') }}
  # Assumes the sleep time falls before midnight
  minutes_until_sleep: >-
    {% set sleep_parts = states(sleep_time_entity).split(':') %}
    {% set sleep_minutes = sleep_parts[0] | int * 60 + sleep_parts[1] | int %}
    {{ sleep_minutes - now().hour * 60 - now().minute }}

  # "<mode>|<temperature>|<fan>|<phase>", pending until the airco echoes it back
  intent_entity: input_text.masterbedroom_climate_write_ctx
  intent: "{{ states(intent_entity).split('|') }}"
  # Onecta reports the setpoint as 24 where we sent 24.0, so compare numerically
  airco_matches_intent: >-
    {{ intent | count == 4
       and states(airco_entity) == intent[0]
       and state_attr(airco_entity, 'temperature') | float(-1) == intent[1] | float(-2)
       and state_attr(airco_entity, 'fan_mode') == intent[2] }}

  anchors:
    - &airco_off
      alias: "Turn off the airco (skipped when already off — every call burns API budget)"
      sequence:
        - if:
            - condition: template
              value_template: "{{ states(airco_entity) != 'off' }}"
          then:
            - alias: "Record the command before sending it"
              action: input_text.set_value
              target:
                entity_id: "{{ intent_entity }}"
              data:
                value: >-
                  off|{{ state_attr(airco_entity, 'temperature') }}|{{
                     state_attr(airco_entity, 'fan_mode') }}|pending
            - action: climate.set_hvac_mode
              target:
                entity_id: "{{ airco_entity }}"
              data:
                hvac_mode: "off"

    - &airco_cool
      alias: "Start/adjust airco cooling toward desired_temp with desired_fan (idempotent)"
      sequence:
        - alias: "Record the command before sending it"
          if:
            - condition: template
              value_template: >-
                {{ states(airco_entity) != 'cool'
                   or state_attr(airco_entity, 'temperature') != desired_temp
                   or state_attr(airco_entity, 'fan_mode') != desired_fan }}
          then:
            - action: input_text.set_value
              target:
                entity_id: "{{ intent_entity }}"
              data:
                value: "cool|{{ desired_temp }}|{{ desired_fan }}|pending"
        - if:
            - condition: template
              value_template: "{{ states(airco_entity) != 'cool' }}"
          then:
            - action: climate.set_hvac_mode
              target:
                entity_id: "{{ airco_entity }}"
              data:
                hvac_mode: "cool"
        - if:
            - condition: template
              value_template: "{{ state_attr(airco_entity, 'temperature') != desired_temp }}"
          then:
            - action: climate.set_temperature
              target:
                entity_id: "{{ airco_entity }}"
              data:
                temperature: "{{ desired_temp }}"
        - if:
            - condition: template
              value_template: "{{ state_attr(airco_entity, 'fan_mode') != desired_fan }}"
          then:
            - action: climate.set_fan_mode
              target:
                entity_id: "{{ airco_entity }}"
              data:
                fan_mode: "{{ desired_fan }}"

action:
  - alias: "Confirm the last command once the airco reports it back"
    if:
      - condition: template
        value_template: >-
          {{ intent | count == 4 and intent[3] == 'pending'
             and airco_matches_intent }}
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ intent_entity }}"
        data:
          value: "{{ intent[:3] | join('|') }}|ok"

  - choose:
      # Above away on purpose: an empty house is fine to cool on free power
      - alias: "Solar pre-cool — cheap cooling window while exporting to the grid"
        conditions:
          - condition: state
            entity_id: input_boolean.masterbedroom_climate_manual_control
            state: "off"
          - alias: "The sleep hold owns the room once it is winding down"
            condition: template
            value_template: >-
              {{ not (is_state(room_mode_entity, 'Slaap')
                      or is_state(room_mode_entity, 'Dutje')) }}
          - alias: "Not before the sealed-house window, not after bedtime"
            condition: template
            value_template: "{{ now() >= today_at(precool_not_before) }}"
          - condition: template
            value_template: "{{ minutes_until_sleep > 0 }}"
          # A hungry office raises the bar even mid-run, so this room also yields
          - alias: "Enough solar surplus, the occupied office gets first claim"
            condition: template
            value_template: >-
              {{ available_surplus >=
                 (export_start_kw + office_reserve_kw if mancave_needs_comfort
                  else (export_stop_kw if is_state(airco_entity, 'cool')
                        else export_start_kw)) }}
          # A hot day, reactive or predicted
          - or:
              - condition: state
                entity_id: binary_sensor.is_hot_day
                state: "on"
              - condition: state
                entity_id: binary_sensor.is_hot_day_predicted
                state: "on"
          # Keeps matching while running, so a changed target reaches the unit
          # Neither starts nor keeps running when it's cooler outside: the window is the tool
          - alias: "The room is still above its pre-cool target"
            condition: template
            value_template: >-
              {{ (room_temp >= target_room_temperature + temp_hysteresis
                  or (airco_compressor_active
                      and room_temp > target_room_temperature - temp_hysteresis))
                 and outdoor_temp >= room_temp - 1 }}
        sequence:
          # Early-afternoon cooling is doubly cheap — exported solar + mild
          # outdoor temperatures mean high COP — and the room's mass stores it
          - variables:
              desired_temp: "{{ target_room_temperature }}"
              desired_fan: "auto"
          - *airco_cool

      - alias: "Pre-bed window — within an hour of the scheduled sleep time"
        conditions:
          - condition: state
            entity_id: input_boolean.masterbedroom_climate_manual_control
            state: "off"
          - condition: template
            value_template: "{{ is_state(room_mode_entity, 'Wakker') }}"
          - alias: "Within 60 minutes of the scheduled sleep time"
            condition: template
            value_template: "{{ 0 <= minutes_until_sleep <= 60 }}"
          - alias: "At least one of us is likely sleeping here tonight"
            condition: template
            value_template: "{{ anyone_likely_home_tonight }}"
          # On a day the pre-cool worked, this is a no-op — that's the design goal
          # Keeps matching while running, so a dropped command is retried
          - >-
            {{ room_temp >= target_sleep_temperature + temp_hysteresis
               or (airco_compressor_active
                   and room_temp > target_sleep_temperature - temp_hysteresis) }}
          # When it's cooler outside the window is the tool, not the compressor
          - "{{ outdoor_temp >= room_temp - 1 }}"
        sequence:
          - variables:
              desired_temp: "{{ target_sleep_temperature }}"
              desired_fan: "auto"
          - *airco_cool

      - alias: "Away — no comfort cooling for an empty room"
        conditions:
          - condition: state
            entity_id: binary_sensor.everyone_left_home
            state: "on"
        sequence:
          - *airco_off

      - alias: "Leave the airco alone while it is manually controlled"
        conditions:
          - condition: state
            entity_id: input_boolean.masterbedroom_climate_manual_control
            state: "on"
        sequence:
          - stop: "Airco is manually controlled"

      - alias: "Sleep — comfort priority is silence and stability"
        conditions:
          - alias: "Room is winding down or napping"
            condition: template
            value_template: >-
              {{ is_state(room_mode_entity, 'Slaap') or is_state(room_mode_entity, 'Dutje') }}
        sequence:
          - if:
              - alias: "Respect a manual fan_only override — never touch it"
                condition: template
                value_template: "{{ not is_state(airco_entity, 'fan_only') }}"
            then:
              - choose:
                  - alias: >-
                      Tropical night — a steady quiet hold disturbs sleep less
                      than the 4am heat drift
                    conditions:
                      - "{{ outdoor_temp > tropical_night_threshold }}"
                      # Start above the ceiling, keep re-asserting down to the
                      # release point — also retries commands the cloud drops
                      - >-
                        {{ room_temp > sleep_hold_temperature
                           or (airco_compressor_active
                               and room_temp > sleep_hold_temperature - temp_hysteresis) }}
                      - or:
                          # Predicted tropical night: windows advised shut, hold owns the night
                          - condition: state
                            entity_id: binary_sensor.is_tropical_night_predicted
                            state: "on"
                          - alias: "No free-cooling headroom left outside"
                            condition: template
                            value_template: "{{ outdoor_temp > room_temp - 2 }}"
                    sequence:
                      - variables:
                          desired_temp: "{{ sleep_hold_temperature }}"
                          desired_fan: "quiet"
                      - *airco_cool

                  - alias: "Anything the hold doesn't own is released"
                    conditions:
                      - condition: template
                        value_template: "{{ airco_compressor_active }}"
                    sequence:
                      - *airco_off

      - alias: "Cool-down / release — stop the compressor once its job is done"
        conditions:
          - alias: "Airco is running a mode we can safely stop"
            condition: template
            value_template: "{{ airco_compressor_active }}"
          - or:
              - alias: "Evening crossover — free cooling beats the compressor"
                condition: template
                value_template: "{{ outdoor_temp < room_temp - 1 }}"
              # Stop bar, not start bar: a run rides out short cloud dips
              - alias: "Solar surplus has genuinely stopped"
                condition: template
                value_template: "{{ available_surplus < export_stop_kw }}"
              - alias: "Comfortably at (or below) target"
                condition: template
                value_template: "{{ room_temp <= awake_target - temp_hysteresis }}"
              - and:
                  - alias: "Yield — the office is warm and there isn't surplus for both"
                    condition: template
                    value_template: "{{ mancave_needs_comfort }}"
                  - condition: template
                    value_template: >-
                      {{ available_surplus < export_start_kw + office_reserve_kw }}
        sequence:
          - *airco_off
