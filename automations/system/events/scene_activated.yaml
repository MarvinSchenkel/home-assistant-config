---
description: Keep track of the currently activated scene
alias: system_events_scene_activated
mode: queued
id: f6759b16-37b1-4190-bec1-51f7f4bd3128

trigger:
  - trigger: event
    event_type: call_service
    event_data:
      domain: scene
      service: turn_on

variables:
  scenes: >
    {{
      [trigger.event.data.service_data.entity_id]
      if trigger.event.data.service_data.entity_id is string
      else trigger.event.data.service_data.entity_id
    }}
  # scene.<room>_<category>_<name> -> input_select.<room>_current_<category>_scene, if it exists
  tracked: >-
    {% set ns = namespace(items=[]) %}
    {% for scene in scenes | select('string') %}
      {% set parts = scene.replace('scene.', '').split('_') %}
      {% if parts | count >= 3 %}
        {% set select = 'input_select.' ~ parts[0] ~ '_current_' ~ parts[1] ~ '_scene' %}
        {% if has_value(select) %}
          {% set ns.items = ns.items + [{'select': select, 'option': parts[2]}] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

condition:
  - condition: template
    value_template: "{{ tracked | count > 0 }}"

action:
  # When multiple scenes are activated, the automation is triggered once with a list of
  # entity_ids
  - repeat:
      for_each: "{{ tracked }}"
      sequence:
        - action: input_select.select_option
          target:
            entity_id: "{{ repeat.item.select }}"
          data:
            option: "{{ repeat.item.option }}"
