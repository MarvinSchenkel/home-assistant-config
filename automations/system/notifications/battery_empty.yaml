---
description: >
  Send me a notification when a battery of a device labeled
  battery_monitored gets low, plus a weekly list of all low batteries.
alias: system_notifications_battery_low
mode: queued
id: 10d6cc7f-dabc-452d-976f-fdc683d7bbe7

trigger:
  - trigger: battery.level_crossed_threshold
    target:
      label_id: battery_monitored
    options:
      threshold:
        type: below
        value:
          number: 20
    id: "battery_level_low"

  - trigger: battery.became_low
    target:
      label_id: battery_monitored
    id: "battery_flag_low"

  - trigger: time
    at: "10:00:00"
    weekday: sun
    id: "weekly_digest"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: "weekly_digest"
        sequence:
          - variables:
              low_batteries: >-
                {% set ns = namespace(items=[]) %}
                {% for device in label_devices('battery_monitored') %}
                  {% set name = device_attr(device, 'name_by_user')
                     or device_attr(device, 'name') %}
                  {% for entity in device_entities(device)
                     if is_state_attr(entity, 'device_class', 'battery') %}
                    {% set level = states(entity) %}
                    {% if entity.startswith('sensor.') and is_number(level)
                       and level | float < 20 %}
                      {% set pct = level | float | round(0) | int %}
                      {% set ns.items = ns.items + [name ~ ' (' ~ pct ~ '%)'] %}
                    {% elif entity.startswith('binary_sensor.') and level == 'on' %}
                      {% set ns.items = ns.items + [name ~ ' (laag)'] %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.items }}
          - if:
              - "{{ low_batteries | count > 0 }}"
            then:
              - action: script.send_notification
                data:
                  receivers:
                    - "marvin"
                  emoji: "🪫"
                  message: >-
                    Deze batterijen zijn bijna leeg: {{ low_batteries | join(', ') }}

      - conditions:
          - condition: trigger
            id: "battery_flag_low"
        sequence:
          - action: script.send_notification
            data:
              receivers:
                - "marvin"
              emoji: "🪫"
              message: >-
                De batterij van {{ state_attr(trigger.entity_id, 'friendly_name') }}
                is bijna leeg!

    default:
      - action: script.send_notification
        data:
          receivers:
            - "marvin"
          emoji: "🪫"
          message: >-
            De batterij van {{ state_attr(trigger.entity_id, 'friendly_name') }}
            is minder dan 20% ({{ states(trigger.entity_id) }}%)!
