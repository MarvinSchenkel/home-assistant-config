---
description: >
  Send a notification when one of our garbage cans is being picked up tomorrow
alias: notification_garbage
mode: single
id: 6488cf53-5292-4146-a44b-80ed0cf4ad7e

trigger:
  - trigger: time
    at: "18:00:00"

condition:
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.rmn_morgen
        state:
          - "Geen"
          - "unknown"
          - "unavailable"

action:
  - action: script.send_notification
    data:
      receivers:
        - "marvin"
        - "laura"
        - "intercom"
      emoji: "🗑️"
      message: "Morgen wordt {{ states('sensor.rmn_morgen') }} opgehaald!"
