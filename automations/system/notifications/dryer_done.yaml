---
description: Send a notification when the dryer is done
alias: notification_dryer_done
mode: single
id: 671e238e-50a9-491c-85a6-d2ce824d9745

trigger:
  - trigger: numeric_state
    entity_id: sensor.aeg_droger_timetoend
    below: 1

condition:
  - alias: "Ignore the first reading after a restart or an unavailable blip"
    condition: template
    value_template: >
      {{ trigger.platform == 'numeric_state'
         and trigger.from_state is not none
         and is_number(trigger.from_state.state) }}

action:
  - action: script.send_notification
    data:
      receivers:
        - "marvin"
        - "laura"
        - "intercom"
      emoji: "💨"
      message: >
        De droger is klaar
