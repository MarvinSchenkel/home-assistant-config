---
description: >
  Send a notification with a snapshot when someone rings the doorbell.
  Notification only: the front door and hall lights are left to their area
  automations (lighting them on a ring broke Sint Maarten).
alias: system_notifications_doorbell
# Restart so a second ring notifies again
mode: restart
id: cb689da9-474a-48af-b945-e68e48fa6eeb

trigger:
  - trigger: event.received
    target:
      entity_id: event.g4_doorbell_doorbell
    options:
      event_type:
        - ring

variables:
  event_id: "{{ state_attr('event.g4_doorbell_doorbell', 'event_id') }}"

action:
  - parallel:
      # One call per receiver so nobody waits on the other's notification
      - action: script.send_notification
        data:
          receivers:
            - "marvin"
          message: >-
            🛎️ De bel gaat!
          image: "/api/unifiprotect/thumbnail/5b2cd98901627e03e70003e9/{{ event_id }}"
          interruption_level: time-sensitive

      - action: script.send_notification
        data:
          receivers:
            - "laura"
          message: >-
            🛎️ De bel gaat!
          image: "/api/unifiprotect/thumbnail/5b2cd98901627e03e70003e9/{{ event_id }}"
          interruption_level: time-sensitive
