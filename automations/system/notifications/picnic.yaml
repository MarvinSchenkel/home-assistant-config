---
description: >
  Announce a Picnic delivery the evening before and in the morning, then
  follow the exact window in a Live Activity from 1 hour before delivery
alias: system_notifications_picnic_today
mode: queued
id: 19f54bfb-fae0-46a2-b72c-75cbf467dfd2

trigger:
  - trigger: time
    at: "18:00:00"
    id: day_before
  - trigger: time
    at: "08:00:00"
    id: morning
  - trigger: time
    at:
      entity_id: sensor.picnic_next_delivery_eta_start
      offset: "-01:00:00"
    id: live
  - trigger: state
    entity_id:
      - sensor.picnic_next_delivery_eta_start
      - sensor.picnic_next_delivery_eta_end
    not_to:
      - unavailable
      - unknown
    id: live
  # The entity time trigger is not retroactive, resync after a restart or reload
  - trigger: homeassistant
    event: start
    id: live
  - trigger: event
    event_type: automation_reloaded
    id: live
  - trigger: state
    entity_id: sensor.picnic_bezorgtijd_laatste_bestelling
    # The sensor is unknown until the open order is delivered, so only skip restarts
    not_from: unavailable
    not_to:
      - unavailable
      - unknown
    id: live_end
  - trigger: time
    at: sensor.picnic_next_delivery_eta_end
    id: live_end

variables:
  phones:
    - notify.mobile_app_marvins_iphone_13
    - notify.mobile_app_iphone_van_l_a
  live_tag: picnic_delivery
  eta_start: >
    {{ as_timestamp(states('sensor.picnic_next_delivery_eta_start'), 0) }}
  eta_end: >
    {{ as_timestamp(states('sensor.picnic_next_delivery_eta_end'), 0) }}
  slot_start: >
    {{ as_timestamp(states('sensor.picnic_begin_van_het_tijdslot_van_de_volgende_bestelling'), 0) }}
  slot_end: >
    {{ as_timestamp(states('sensor.picnic_einde_van_het_tijdslot_van_de_volgende_bestelling'), 0) }}
  # The short ETA window is only known on the delivery day, fall back to the booked slot
  has_eta: >
    {{ eta_end > eta_start > 0
       and (eta_start | timestamp_custom('%Y-%m-%d'))
           == (slot_start | timestamp_custom('%Y-%m-%d')) }}
  window_start: "{{ eta_start if has_eta else slot_start }}"
  window_end: "{{ eta_end if has_eta else slot_end }}"
  window: >-
    {{ window_start | timestamp_custom('%H:%M') }}
    en {{ window_end | timestamp_custom('%H:%M') }}
  delivery_date: "{{ slot_start | timestamp_custom('%Y-%m-%d') }}"
  live_window: "{{ eta_start | int }}|{{ eta_end | int }}"
  last_live_window: "{{ states('input_text.picnic_live_window') }}"
  # Only push when the window opens or either edge moved 5 minutes or more since the last push
  live_window_moved: >
    {% set last = (last_live_window | string).split('|') %}
    {{ last | count != 2
       or (eta_start - last[0] | float(0)) | abs >= 300
       or (eta_end - last[1] | float(0)) | abs >= 300 }}

action:
  - choose:
      - conditions:
          - condition: trigger
            id: day_before
          - "{{ delivery_date == (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}"
        sequence:
          - action: script.send_notification
            data:
              receivers:
                - "marvin"
                - "laura"
              emoji: "🛒"
              message: "Picnic komt morgen bezorgen tussen {{ window }}."

      - conditions:
          - condition: trigger
            id: morning
          - "{{ delivery_date == now().strftime('%Y-%m-%d') }}"
        sequence:
          - action: script.send_notification
            data:
              receivers:
                - "marvin"
                - "laura"
                - "intercom"
              emoji: "🛒"
              message: "Picnic bezorgt vandaag tussen {{ window }}!"

      # Pushes with the same tag update the Live Activity in place, only the first one alerts
      - conditions:
          - condition: trigger
            id: live
          - "{{ eta_end > eta_start > 0 }}"
          - "{{ eta_start - 3600 <= as_timestamp(now()) < eta_end }}"
          - "{{ live_window_moved }}"
        sequence:
          # Stored before pushing so the queued run of the sibling ETA trigger skips
          - action: input_text.set_value
            target:
              entity_id: input_text.picnic_live_window
            data:
              value: "{{ live_window }}"
          - repeat:
              for_each: "{{ phones }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "Picnic"
                    message: >-
                      Bezorging tussen {{ eta_start | timestamp_custom('%H:%M') }}
                      en {{ eta_end | timestamp_custom('%H:%M') }}
                    data:
                      tag: "{{ live_tag }}"
                      live_update: true
                      silent: true
                      # The countdown replaces the message line, so the full window goes here
                      critical_text: >-
                        {{ eta_start | timestamp_custom('%H:%M') }}–{{ eta_end | timestamp_custom('%H:%M') }}
                      chronometer: true
                      when: "{{ eta_start | int }}"
                      notification_icon: "mdi:cart-outline"

      - conditions:
          - condition: trigger
            id: live_end
        sequence:
          - repeat:
              for_each: "{{ phones }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: "clear_notification"
                    data:
                      tag: "{{ live_tag }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.picnic_live_window
            data:
              value: ""
