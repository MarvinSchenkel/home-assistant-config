---
description: Send a notification when the short window of the picnic delivery is known
alias: system_notifications_picnic_today
# Queued so the second trigger of a start+end change sees the stored window
mode: queued
id: 19f54bfb-fae0-46a2-b72c-75cbf467dfd2

trigger:
  - trigger: state
    entity_id:
      - sensor.picnic_next_delivery_eta_start
      - sensor.picnic_next_delivery_eta_end
    not_to:
      - unavailable
      - unknown
  - trigger: time
    at: "08:30:00"
    id: reminder

variables:
  eta_start: >
    {{ as_timestamp(states('sensor.picnic_next_delivery_eta_start'), 0) }}
  eta_end: >
    {{ as_timestamp(states('sensor.picnic_next_delivery_eta_end'), 0) }}
  eta_window: "{{ eta_start }}|{{ eta_end }}"
  days_left: >
    {{ ((eta_start | as_datetime | as_local).date() - now().date()).days }}
  day_name: >-
    {% if days_left == 0 %} vandaag
    {% elif days_left == 1 %} morgen
    {% endif %}

condition:
  - "{{ days_left < 2 }}"
  - "{{ eta_end > eta_start > as_timestamp(now()) }}"
  # Picnic API outages flap the sensors; only a changed window is news
  - "{{ trigger.id == 'reminder'
      or eta_window != states('input_text.picnic_last_notified_eta') }}"

action:
  - action: input_text.set_value
    target:
      entity_id: input_text.picnic_last_notified_eta
    data:
      value: "{{ eta_window }}"
  - action: script.send_notification
    data:
      receivers:
        - "marvin"
        - "laura"
        - "intercom"
      emoji: "🛒"
      message: >-
        Picnic bezorgt {{ day_name }} tussen
        {{ eta_start | timestamp_custom('%H:%M') }}
        en {{ eta_end | timestamp_custom('%H:%M') }}!
