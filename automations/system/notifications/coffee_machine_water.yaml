---
description: Ask Marvin to fill the espresso machine's tank when it wakes up low on water
alias: notification_coffee_machine_water
mode: single
id: 9953cb68-4b0b-4dd8-ae0d-8e3468307fab

trigger:
  - trigger: state
    entity_id: switch.decent_espresso_de1pro_de1_on
    from: "off"
    to: "on"

# Checked on wake only, the level reading wobbles about 30 mL around any threshold
condition:
  - condition: numeric_state
    entity_id: sensor.decent_espresso_de1pro_de1_water_level
    below: 500

action:
  - action: script.send_notification
    data:
      receivers:
        - "marvin"
      type: "home_only"
      emoji: "💧"
      message: >
        Vul het waterreservoir van de koffiemachine bij, er zit nog
        {{ states("sensor.decent_espresso_de1pro_de1_water_level") | int }} ml in
