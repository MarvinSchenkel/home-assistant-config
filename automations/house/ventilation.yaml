---
description: Control the central ventilation based on several triggers
alias: house_ventilation
mode: queued
id: C90E1ED3-EF56-4F15-A5C7-47F1D75B1F85

trigger:
  - trigger: homeassistant
    event: start

  - trigger: event
    event_type: automation_reloaded

  - trigger: state
    entity_id: input_boolean.house_mode_cooking
    to: "on"
    id: cooking_on

  - trigger: state
    entity_id: input_boolean.house_mode_cooking
    to: "off"
    id: cooking_off

  - trigger: state
    entity_id: binary_sensor.sauna
    to: "on"
    id: sauna_on

  - trigger: state
    entity_id: binary_sensor.sauna
    to: "off"
    id: sauna_off

  - trigger: state
    entity_id: binary_sensor.oven_running
    to: "on"
    id: oven_on

  - trigger: state
    entity_id: binary_sensor.oven_running
    to: "off"
    id: oven_off

  - trigger: state
    entity_id: binary_sensor.wc_ventilation_demand
    to: "on"
    id: wc_on

  - trigger: state
    entity_id: binary_sensor.wc_ventilation_demand
    to: "off"
    id: wc_off

  - trigger: state
    entity_id:
      - binary_sensor.bathroom_shower_detected
      - binary_sensor.bathroom_humidity_high
      - binary_sensor.everyone_left_home
      - input_boolean.setting_guest_mode
      - binary_sensor.ventilation_night_purge
      - timer.house_ventilation_cooking_runon
      - timer.house_ventilation_oven_runon
      - timer.house_ventilation_sauna_runon
      - timer.house_ventilation_wc_runon

  - trigger: time_pattern
    minutes: "/15"

variables:
  anchors:
    - &set_speed_100
      alias: "Set the ventilation to 100%"
      action: fan.set_percentage
      data:
        percentage: 100
      target:
        entity_id: fan.itho

    - &set_speed_70
      alias: "Set the ventilation to 70%"
      action: fan.set_percentage
      data:
        percentage: 70
      target:
        entity_id: fan.itho

    - &set_speed_47
      alias: "Set the ventilation to 47%"
      action: fan.set_percentage
      data:
        percentage: 47
      target:
        entity_id: fan.itho

    - &set_speed_8
      alias: "Set the ventilation to 8%"
      action: fan.set_percentage
      data:
        percentage: 8
      target:
        entity_id: fan.itho

action:
  # Trigger ids follow the <source>_on / <source>_off convention, which maps
  # onto timer.house_ventilation_<source>_runon. Home Assistant falls back to
  # the numeric trigger index for triggers without an id, so the endswith
  # checks are what actually select the run-on triggers here.
  - choose:
      - alias: "Cancel the run-on timer when a boost source activates"
        conditions:
          - condition: template
            value_template: "{{ trigger.id is defined and trigger.id.endswith('_on') }}"
        sequence:
          - action: timer.cancel
            target:
              entity_id: "timer.house_ventilation_{{ trigger.id[:-3] }}_runon"

      - alias: "Start the run-on timer when a boost source deactivates"
        conditions:
          - condition: template
            value_template: >
              {{ trigger.id is defined and trigger.id.endswith('_off')
              and trigger.from_state.state == 'on' }}
        sequence:
          - action: timer.start
            target:
              entity_id: "timer.house_ventilation_{{ trigger.id[:-4] }}_runon"

  - choose:
      - alias: "Keep the ventilation at full speed for active demand"
        conditions:
          - or:
              - condition: state
                entity_id: input_boolean.house_mode_cooking
                state: "on"
              - condition: state
                entity_id: timer.house_ventilation_cooking_runon
                state: active
              - condition: state
                entity_id: binary_sensor.bathroom_shower_detected
                state: "on"
              - condition: state
                entity_id: binary_sensor.bathroom_humidity_high
                state: "on"
              - condition: state
                entity_id: binary_sensor.sauna
                state: "on"
              - condition: state
                entity_id: timer.house_ventilation_sauna_runon
                state: active
              - condition: state
                entity_id: binary_sensor.wc_ventilation_demand
                state: "on"
              - condition: state
                entity_id: timer.house_ventilation_wc_runon
                state: active
        sequence:
          - *set_speed_100

      - alias: "Boost the ventilation while an oven runs"
        conditions:
          - or:
              - condition: state
                entity_id: binary_sensor.oven_running
                state: "on"
              - condition: state
                entity_id: timer.house_ventilation_oven_runon
                state: active
        sequence:
          - *set_speed_70

      - alias: "Use the summer night purge speed when it is eligible"
        conditions:
          - condition: state
            entity_id: binary_sensor.ventilation_night_purge
            state: "on"
        sequence:
          - *set_speed_70

      - alias: "Use the occupied baseline when someone is home"
        conditions:
          - or:
              - condition: state
                entity_id: binary_sensor.everyone_left_home
                state: "off"
              - condition: state
                entity_id: input_boolean.setting_guest_mode
                state: "on"
        sequence:
          - *set_speed_47

    default:
      - *set_speed_8
