---
description: Control the central ventilation based on several triggers
alias: house_ventilation
mode: queued
id: C90E1ED3-EF56-4F15-A5C7-47F1D75B1F85

trigger:
  - trigger: homeassistant
    event: start

  - trigger: event
    event_type: automation_reloaded

  - trigger: state
    entity_id: binary_sensor.bathroom_shower_detected
    to: "on"

  - trigger: state
    entity_id: binary_sensor.bathroom_shower_detected
    to: "off"
    for:
      minutes: 15

  - trigger: numeric_state
    entity_id:
      - sensor.bathroom_ble_humidity
    above: 80

  - trigger: numeric_state
    entity_id:
      - sensor.bathroom_ble_humidity
    below: 75

  - trigger: state
    entity_id:
      - light.wc
    to: "on"
    for:
      minutes: 4

  - trigger: state
    entity_id:
      - light.wc
    to: "off"
    for:
      minutes: 10

  - trigger: state
    entity_id:
      - input_boolean.house_mode_cooking

  - trigger: state
    entity_id:
      - binary_sensor.sauna
    to: "on"

  - trigger: state
    entity_id:
      - binary_sensor.sauna
    to: "off"
    for:
      minutes: 15

  - trigger: numeric_state
    entity_id:
      - sensor.weather_current_humidity
    above: 80

  # Hourly re-evaluation for the hot-day night purge window
  - trigger: time_pattern
    minutes: "0"

variables:
  anchors:
    - &turn_on
      alias: "Turns on the ventilation"
      action: fan.set_percentage
      data:
        percentage: 100
      target:
        entity_id: fan.itho

    - &turn_off
      alias: "Turns off the ventilation"
      action: fan.set_percentage
      data:
        percentage: 8
      target:
        entity_id: fan.itho

    - &shower_on
      alias: "When someone is taking a shower"
      condition: state
      entity_id: binary_sensor.bathroom_shower_detected
      state: "on"

action:
  choose:

    - alias: "Check if someone is cooking"
      conditions:
        - alias: "Cooking mode is on"
          condition: state
          entity_id:
            - input_boolean.house_mode_cooking
          state: "on"
      sequence:
        - *turn_on

    - conditions:
        - alias: "Someone is taking a shower or humidity is very high"
          condition: and
          conditions:
            - or:
                # - condition: numeric_state
                #   entity_id:
                #     - sensor.weather_current_humidity
                #   below: 80
                - *shower_on
                - condition: numeric_state
                  entity_id:
                    - sensor.bathroom_ble_humidity
                  above: 80
      sequence:
        - *turn_on

    - alias: "When there is some number 2 action going on"
      conditions:
        - alias: "When the restoom lights are on for longer than 4 minutes"
          condition: state
          entity_id: light.wc
          state: "on"
          for:
            minutes: 4
      sequence:
        - *turn_on

    - alias: "Turn on when we are using the sauna"
      conditions:
        - alias: "When the sauna is on"
          condition: state
          entity_id: binary_sensor.sauna
          state: "on"
      sequence:
        - *turn_on

    - alias: "Night purge — flush out a hot day with cool night air"
      conditions:
        - condition: time
          after: "21:00:00"
          before: "08:00:00"
        - alias: "It is meaningfully cooler outside than in the hallway"
          condition: template
          value_template: >-
            {{ (states("sensor.current_temperature") | float(0))
               < (states("sensor.pir_hall_upstairs_temperature") | float(0)) - 1 }}
        - alias: "The house is still holding the day's heat"
          condition: numeric_state
          entity_id: sensor.pir_hall_upstairs_temperature
          above: 22.5
      sequence:
        # 70 instead of 100: enough draft to purge, quiet enough to sleep near
        - alias: "Run the ventilation at purge speed"
          action: fan.set_percentage
          data:
            percentage: 70
          target:
            entity_id: fan.itho

  default:
    - *turn_off
