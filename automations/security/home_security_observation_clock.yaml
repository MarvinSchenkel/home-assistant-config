---
alias: home_security_observation_clock
description: Initialize the observation clock when security monitoring starts
mode: single
id: 9b7dcf72-0b63-4fd4-bc18-8c7be4c7f501
trigger:
  - trigger: homeassistant
    id: startup
    event: start
  - trigger: state
    id: enabled
    entity_id: input_boolean.home_security_enabled
    from: "off"
    to: "on"
condition:
  - condition: state
    entity_id: input_boolean.home_security_enabled
    state: "on"
  - condition: template
    value_template: >-
      {{ trigger.id == 'enabled'
         or not has_value('input_datetime.home_security_observation_start') }}
action:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.home_security_observation_start
    data:
      datetime: "{{ now().isoformat() }}"
