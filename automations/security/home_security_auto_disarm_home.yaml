---
alias: home_security_auto_disarm_home
description: Automatically disarm night mode when the sleep cycle ends
mode: queued
id: d3baf51e-0ad1-4d1b-8cf9-ef1a2cbb4104
trigger:
  - trigger: homeassistant
    id: reconcile
    event: start
  - trigger: event
    id: reconcile
    event_type: automation_reloaded
  - trigger: time
    id: cycle_end
    at: "07:00:00"
  - trigger: state
    id: cycle_end
    entity_id:
      - input_select.mancave_room_mode
      - input_select.master_bedroom_room_mode
    from: Slaap
  # Re-check the sleep cycle once an alarm window expires back into armed_night
  - trigger: state
    id: cycle_end
    entity_id: alarm_control_panel.home_security
    from: triggered
    to: armed_night
  - trigger: state
    id: disabled
    entity_id: input_boolean.home_security_enabled
    to: "off"
condition:
  - or:
      - condition: state
        entity_id: alarm_control_panel.home_security
        state: armed_night
      - condition: state
        entity_id: input_boolean.home_security_night_arm_pending
        state: "on"
  - condition: template
    value_template: >-
      {{ is_state('input_boolean.home_security_enabled', 'off')
         or not (now().hour >= 18 or now().hour < 7)
         or not (
           is_state('input_select.mancave_room_mode', 'Slaap')
           and is_state('input_select.master_bedroom_room_mode', 'Slaap')
         ) }}
  - condition: template
    value_template: >-
      {{ trigger.id != 'reconcile'
         or is_state('input_boolean.home_security_automatic_arm', 'on')
         or is_state('input_boolean.home_security_night_arm_pending', 'on') }}
action:
  - action: script.home_security_disarm
