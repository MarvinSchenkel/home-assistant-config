---
alias: home_security_auto_disarm_away
description: Automatically disarm away mode when the away cycle ends
mode: queued
id: ebc3f5a1-47c8-44d4-9d2b-4f9d1d22a103
trigger:
  - trigger: homeassistant
    id: reconcile
    event: start
  - trigger: event
    id: reconcile
    event_type: automation_reloaded
  - trigger: state
    id: cycle_end
    entity_id:
      - binary_sensor.everyone_left_home
    to: "off"
  - trigger: state
    id: cycle_end
    entity_id: input_boolean.setting_guest_mode
    to: "on"
  - trigger: state
    id: disabled
    entity_id: input_boolean.home_security_enabled
    to: "off"
condition:
  - or:
      - condition: state
        entity_id: input_select.home_security_armed_mode
        state: armed_away
      - condition: state
        entity_id: input_boolean.home_security_away_arm_pending
        state: "on"
  - or:
      - condition: state
        entity_id: input_boolean.home_security_enabled
        state: "off"
      - condition: state
        entity_id: binary_sensor.everyone_left_home
        state: "off"
      - condition: state
        entity_id: input_boolean.setting_guest_mode
        state: "on"
  - condition: template
    value_template: >-
      {{ trigger.id != 'reconcile'
         or is_state('input_boolean.home_security_automatic_arm', 'on')
         or is_state('input_boolean.home_security_away_arm_pending', 'on') }}
action:
  - action: script.home_security_disarm
    data:
      clear_incident: false
