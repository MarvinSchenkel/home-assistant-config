---
alias: home_security_vacuum_grace
description: Keep motion suppressed briefly after the vacuum stops
mode: restart
id: d4141a14-063e-43fb-aa74-c588f2b8b17b
trigger:
  - trigger: state
    entity_id: vacuum.norby
    from: cleaning
  - trigger: state
    entity_id: vacuum.norby
    from: returning
condition:
  - condition: template
    value_template: >-
      {{ states('vacuum.norby') not in ['cleaning', 'returning'] }}
action:
  - action: timer.start
    target:
      entity_id: timer.home_security_vacuum_grace
