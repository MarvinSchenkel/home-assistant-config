---
alias: home_security_entry_delay_finished
description: Finish the away entry delay
mode: queued
id: 4f0df919-9c16-4b63-9f3f-2fb4e2d57106
trigger:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.home_security_entry_delay
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
action:
  - variables:
      pending_entry: >-
        {{ states('input_text.home_security_pending_entry_source') or 'Entry delay finished' }}
  - choose:
      - conditions:
          - condition: state
            entity_id: input_select.home_security_armed_mode
            state: armed_away
          - condition: state
            entity_id: binary_sensor.everyone_left_home
            state: "off"
        sequence:
          - action: script.home_security_disarm
            data:
              clear_incident: false

      - conditions:
          - condition: state
            entity_id: input_select.home_security_armed_mode
            state: armed_away
          - condition: state
            entity_id: input_boolean.home_security_incident_active
            state: "off"
          - condition: state
            entity_id: timer.home_security_entry_delay
            state: idle
          - condition: template
            value_template: >-
              {{ states('input_text.home_security_pending_entry_source') | length > 0 }}
        sequence:
          - action: script.home_security_trigger
            data:
              mode: away
              trigger_name: "{{ pending_entry }}"
              trigger_entity: timer.home_security_entry_delay
              details: >-
                Away intrusion after entry delay from {{ pending_entry }}
