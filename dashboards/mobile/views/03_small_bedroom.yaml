path: smallbedroom
title: Slaapkamer Zoey
icon: "mdi:koala"
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        card_mod:
          style: |
            ha-card {
              border: 0px;
              background-color: transparent;
              box-shadow: none;
            }
        content: >
          ## Slaapkamer Zoey

      - type: horizontal-stack
        cards:
          - type: tile
            entity: input_select.smallbedroom_current_cover_scene
            icon: "mdi:blinds"
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Gordijn
                  content:
                    type: entities
                    entities:
                      - name: Open
                        entity: scene.smallbedroom_cover_open
                      - name: Dicht
                        entity: scene.smallbedroom_cover_closed

      - type: horizontal-stack
        cards:
          - type: tile
            entity: binary_sensor.presence_small_bedroom
          - type: tile
            entity: binary_sensor.smallbedroom_door_open
